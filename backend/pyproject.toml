# Lock Python: pip-compile --generate-hashes -o requirements.lock requirements.in
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "nexo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
 "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
 "pydantic-settings>=2.7,<3", "PyJWT[crypto]>=2.10,<3",
 "arq>=0.26,<1", "langgraph>=1,<2", "pgvector>=0.3,<1",
 "httpx>=0.28,<1", "sqlglot>=26,<40"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
