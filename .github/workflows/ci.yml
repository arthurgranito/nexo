name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: ci_postgres_password_2026
          POSTGRES_DB: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nexo:ci_postgres_password_2026@localhost:5432/nexo
      NEXO_API_PASSWORD: nexo_api_ci_password_2026
      NEXO_MIGRATOR_PASSWORD: nexo_migrator_ci_password_2026
      NEXO_EXECUTOR_PASSWORD: nexo_executor_ci_password_2026
      DATABASE_API_URL: postgresql+psycopg://nexo_api:nexo_api_ci_password_2026@localhost:5432/nexo
      DATABASE_EXECUTOR_URL: postgresql+psycopg://nexo_executor:nexo_executor_ci_password_2026@localhost:5432/nexo
      POSTGRES_TEST_URL: postgresql+psycopg://nexo_api:nexo_api_ci_password_2026@localhost:5432/nexo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: pip install -e "./backend" --no-deps
      - run: ruff check backend
      - run: cd backend && alembic upgrade head
      - run: cd backend && pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run typecheck && npm run build
