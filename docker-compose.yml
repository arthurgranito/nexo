name: nexo
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://nexo_api:${NEXO_API_PASSWORD:-nexo_api_local_dev_only}@db:5432/nexo
    DATABASE_API_URL: postgresql+psycopg://nexo_api:${NEXO_API_PASSWORD:-nexo_api_local_dev_only}@db:5432/nexo
    DATABASE_EXECUTOR_URL: postgresql+psycopg://nexo_executor:${NEXO_EXECUTOR_PASSWORD:-nexo_executor_local_dev_only}@db:5432/nexo
    REDIS_URL: redis://redis:6379/0
  networks: [nexo]
x-migrate: &migrate
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://nexo:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/nexo
    NEXO_API_PASSWORD: ${NEXO_API_PASSWORD:-nexo_api_local_dev_only}
    NEXO_MIGRATOR_PASSWORD: ${NEXO_MIGRATOR_PASSWORD:-nexo_migrator_local_dev_only}
    NEXO_EXECUTOR_PASSWORD: ${NEXO_EXECUTOR_PASSWORD:-nexo_executor_local_dev_only}
  networks: [nexo]
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nexo]
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nexo]
  migrate:
    <<: *migrate
    command: [sh, -c, "alembic upgrade head && python -m app.sync_roles"]
    depends_on:
      db: {condition: service_healthy}
  seed:
    <<: *migrate
    profiles: [tools]
    command: [python, -m, app.seed]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [arq, app.worker.WorkerSettings]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://api:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_DEV_AUTH: ${NEXT_PUBLIC_DEV_AUTH:-true}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    networks: [nexo]
volumes:
  postgres_data:
  redis_data:
networks:
  nexo:
